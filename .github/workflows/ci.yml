# Vahini CI — runs on every commit (push + PR) that touches a non-docs file;
# see the paths-ignore note below.
#  - security       : Node unit tests for the persist API's abuse limits, the
#                     OCR-input guard (rate limits, quotas, CORS,
#                     homoglyph/SSRF) and the mailer. No Docker/browser --
#                     runs in seconds, so it's a separate job rather than
#                     tacked onto e2e. It does need `npm ci`: the mailer tests
#                     speak real SMTP to a throwaway server via nodemailer.
#                     (External nmap/testssl scanning of live infra is a
#                     separate, non-blocking workflow: security-scan.yml.)
#  - e2e            : headless Chrome — marketing pages load, analyser smoke check.
#  - e2e-recognition: full stack WITH the OCR backend; proves server recognition
#                     works on a sample. Kept to ~3 min on warm runs via Docker
#                     layer cache (paddle never re-installs), plus Playwright/npm
#                     caches and English-only model warm-up.
#
# The analyser is a submodule (vahinitech/20factor-analyser, see .gitmodules) --
# its own unit/lint/CI live in that repo. This workflow only checks the
# integration between the site and whatever analyser tag is pinned here.
name: CI

on:
  # Docs-only changes skip this whole pipeline -- paths-ignore matches any
  # '**/*.md' file anywhere in the repo (README, CLAUDE.md, docs/**, and any
  # other markdown, e.g. under .github/instructions/) plus docs/**; nothing
  # here builds or tests markdown. A push/PR that touches even one non-doc
  # file still runs everything; paths-ignore only fires when EVERY changed
  # file matches.
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: input-manifest.yaml matches the pinned submodules
        # Keeps the manifest's duplicated pins honest. The checker walks every
        # git-submodule input and compares each entry's own commit against the
        # gitlink at the path that entry declares, so adding/reordering inputs
        # can never leave one silently unvalidated.
        run: python3 tools/check-input-manifest.py
      # These tests were dependency-free until the mailer landed. mailer.test.mjs
      # drives nodemailer against a throwaway SMTP server rather than a stub, so
      # the package has to be installed -- without it the transport never builds
      # and the SMTP checks fail for a reason that has nothing to do with the
      # code under test. The manifest check above is pure python and runs first,
      # so a drifted pin still fails fast without paying for an install.
      - run: npm ci
      - name: Persist API abuse limits, OCR input guard, mailer
        run: npm run test:security

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Headless page + PDF regression
        run: npm run test:e2e

  # Full stack WITH OCR. The slow part (paddle pip install) is cached as a Docker
  # layer via the GHA cache backend, so warm runs skip it entirely (~3 min).
  e2e-recognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Build analyser image (cached paddle layer)
        uses: docker/build-push-action@v6
        with:
          context: ./analyser
          file: ./analyser/deployment/Dockerfile
          tags: vahini/analyser:local
          load: true
          cache-from: type=gha,scope=analyser
          cache-to: type=gha,mode=max,scope=analyser
      - name: Start stack (reuses prebuilt analyser image; English only)
        env:
          VAHINI_OCR_LANGS: en
        run: docker compose up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recognition regression (live backend)
        env:
          VAHINI_BASE_URL: http://localhost:8080
        run: npm run test:recognition
      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs --tail 200 analyser web
      - name: Tear down
        if: always()
        run: docker compose down -v
