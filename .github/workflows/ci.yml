# Vahini CI — runs on every commit (push + PR).
#  - e2e            : headless Chrome — marketing pages load, analyser smoke check.
#  - e2e-recognition: full stack WITH the OCR backend; proves server recognition
#                     works on a sample. Kept to ~3 min on warm runs via Docker
#                     layer cache (paddle never re-installs), plus Playwright/npm
#                     caches and English-only model warm-up.
#
# The analyser is a submodule (vahinitech/20factor-analyser, see .gitmodules) --
# its own unit/lint/CI live in that repo. This workflow only checks the
# integration between the site and whatever analyser tag is pinned here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Headless page + PDF regression
        run: npm run test:e2e

  # Full stack WITH OCR. The slow part (paddle pip install) is cached as a Docker
  # layer via the GHA cache backend, so warm runs skip it entirely (~3 min).
  e2e-recognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Build analyser image (cached paddle layer)
        uses: docker/build-push-action@v6
        with:
          context: ./analyser
          file: ./analyser/deployment/Dockerfile
          tags: vahini/analyser:local
          load: true
          cache-from: type=gha,scope=analyser
          cache-to: type=gha,mode=max,scope=analyser
      - name: Start stack (reuses prebuilt analyser image; English only)
        env:
          VAHINI_OCR_LANGS: en
        run: docker compose up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recognition regression (live backend)
        env:
          VAHINI_BASE_URL: http://localhost:8080
        run: npm run test:recognition
      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs --tail 200 analyser web
      - name: Tear down
        if: always()
        run: docker compose down -v
