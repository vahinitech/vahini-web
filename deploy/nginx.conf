server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    client_max_body_size 25M;
    absolute_redirect off;

    proxy_intercept_errors on;

    # ---- Abuse mitigation (zones/maps live in deploy/nginx-security.conf,
    # installed as conf.d/00-security.conf; see docs/SECURITY.md) -----------
    # Vulnerability scanners get the connection closed without a response.
    if ($vahini_blocked_agent) { return 444; }

    # Default per-IP budget: page-class request rate plus a cap on parallel
    # connections. Locations below override the request zone where the
    # realistic legitimate rate differs (assets faster, ML/persist slower).
    limit_conn perip_conn 40;
    limit_req zone=perip_pages burst=30 nodelay;

    # Browser security headers. Any location that calls add_header itself
    # loses these (nginx inheritance rule) and must re-include the file.
    include /etc/nginx/vahini-headers.inc;

    # Upstream implementation details stay internal.
    proxy_hide_header X-Powered-By;

    # Vulnerability-disclosure contact (RFC 9116).
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:security@vahinitech.com\nExpires: 2027-07-01T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://vahinitech.com/.well-known/security.txt\n";
    }

    # The image ships only /site + nginx config (see .dockerignore), but keep
    # the web root's non-public prefixes and build metadata unreachable even
    # if that regresses.
    location ~ ^/(deploy|services|tools|tests|node_modules)(/|$) { return 404; }
    location ~ ^/(Makefile|Dockerfile[^/]*|docker-compose[^/]*|package(-lock)?\.json|sbom\.spdx\.json)$ { return 404; }

    # Endless background probes for other people's software: close without
    # answering (444) -- cheaper than rendering the 404 page thousands of
    # times a day, and scan tools move on faster.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|cgi-bin|vendor/phpunit) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi|env|bak|sql|swp)$ { return 444; }

    # Dot-files (.git, .env, editor droppings) are never public content;
    # /.well-known/ stays reachable (exact security.txt match above wins).
    location ~ /\.(?!well-known/) { deny all; }

    # The marketing site lives in /site, but every public URL - the
    # sitemap, the canonicals, old backlinks and everything Google indexed
    # before the cutover - is the BARE path (/about.html). Serve the site
    # files at those bare URLs via internal rewrite (no redirect chain for
    # crawlers), and serve / itself directly instead of bouncing.
    # Regex/exact locations above (blocked prefixes, legacy redirects)
    # still win over this prefix location, so nothing unsafe is exposed.
    location = / {
        try_files /site/index.html =404;
    }
    # Crawlers only ever read these at the root.
    location = /robots.txt  { try_files /site/robots.txt  =404; }
    location = /sitemap.xml { try_files /site/sitemap.xml =404; }

    # The old site's indexed URLs (still submitted in Search Console as
    # sitemaps, all failing): permanent-redirect their equity to the
    # closest new page instead of 404ing it away.
    location = /contact { return 301 /reach.html; }
    location = /pricing { return 301 /product.html; }
    location = /scan    { return 301 /analyser/; }

    # Dedicated analyser service hosts analyser pages/assets.
    location ^~ /analyser/ {
        proxy_pass http://analyser:8868;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward compatibility for historical analyser URL.
    location = /Vahini%20Analyser.html {
        return 302 /analyser/analyser.html;
    }

    # Legacy root analyser static files now live under /analyser/styles and /analyser/scripts/core.
    location = /report.css { return 302 /analyser/styles/report.css; }
    location = /studio.css { return 302 /analyser/styles/studio.css; }
    location = /nav.css { return 302 /analyser/styles/nav.css; }
    location = /engine.bundle.js { return 302 /analyser/scripts/core/engine.bundle.js; }
    location = /protect.js { return 302 /analyser/scripts/core/protect.js; }

    # Root-level analyser assets moved to /analyser/assets/.
    location ^~ /assets/ {
        return 302 /analyser$uri;
    }

    # Blog moved from flat /site/blog-<slug>.html files into /site/blog/<slug>.html.
    location = /site/blog.html {
        return 301 /site/blog/index.html;
    }
    location ~ ^/site/blog-(.+)\.html$ {
        return 301 /site/blog/$1.html;
    }

    # The investor notebook became a normal subpage at /site/investor.html.
    location = /site/investor-book.dc.html {
        return 301 /site/investor.html;
    }

    # The analyser submodule (a separate pinned repo, not ours to edit) hardcodes
    # <script src="../site/site.js"> in analyser.html to load the shared nav --
    # that's a cross-repo contract, not just an internal link. site.js itself
    # moved to /site/js/site.js when this repo's CSS/JS got split into folders;
    # keep serving the old path so the analyser app keeps working unmodified.
    location = /site/site.js {
        return 301 /site/js/site.js;
    }

    # OCR endpoint consumed by the analyser app. CPU-bound ML inference is
    # the cheapest way to DoS this box, so the heavy zone is strict: a real
    # analyser session makes a handful of calls per scan, a flood gets 429.
    location = /ocr {
        client_max_body_size 25M;
        limit_req zone=perip_heavy burst=8 nodelay;
        proxy_pass http://analyser:8868/ocr;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    location = /ocr/health {
        proxy_pass http://analyser:8868/ocr/health;
        proxy_read_timeout 10s;
    }

    # The analyser frontend's health probe builds its URL by stripping the
    # /ocr suffix, so through nginx it asks for /health, not /ocr/health.
    # Before this config served real 404s, /health fell into the soft-404
    # and returned the marketing HOME PAGE with HTTP 200 - which the
    # frontend counts as healthy ("non-JSON 200 still counts as up"), so
    # the upload gate only ever opened BY ACCIDENT. Route it to the real
    # health endpoint; without this the analyser upload UI is disabled.
    location = /health {
        proxy_pass http://analyser:8868/ocr/health;
        proxy_read_timeout 10s;
    }

    # Context-aware OCR + layout API consumed by analyser app.
    location = /analyze-vl {
        client_max_body_size 25M;
        limit_req zone=perip_heavy burst=8 nodelay;
        proxy_pass http://analyser:8868/analyze-vl;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    # Python-only 20-factor report API consumed by analyser app.
    location = /report-python {
        client_max_body_size 25M;
        limit_req zone=perip_heavy burst=8 nodelay;
        proxy_pass http://analyser:8868/report-python;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    location @api_json_error {
        default_type application/json;
        return 200 '{"ok":false,"error":"upstream temporarily unavailable","rec_texts":[],"rec_polys":[],"rec_scores":[],"analysis":null,"document_context":{},"layout":{},"regions":[],"factor_regions":{}}';
    }

    # Persistence API for uploads, generated reports, and feedback. These
    # write to disk, so both the rate and the body size are capped here; the
    # service applies its own per-IP quotas on top (services/persist-api).
    location ^~ /persist/ {
        limit_req zone=perip_persist burst=10 nodelay;
        proxy_pass http://persist:8090;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feedback is a small JSON note -- never a 25M body.
    location = /persist/feedback {
        client_max_body_size 256k;
        limit_req zone=perip_persist burst=10 nodelay;
        proxy_pass http://persist:8090/persist/feedback;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /persist/health {
        proxy_pass http://persist:8090/health;
        proxy_read_timeout 10s;
    }

    # Bullet-journal PDF print service (services/bujo-pdf, powered by
    # bujo.js). Generating a 66-page vector PDF is CPU work, so it shares
    # the slow per-IP zone; the service applies its own budget on top.
    location = /bujo/generate {
        limit_req zone=perip_heavy burst=5 nodelay;
        proxy_pass http://bujo:8091/bujo/generate;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bujo/health {
        proxy_pass http://bujo:8091/health;
        proxy_read_timeout 10s;
    }

    # Long cache for static assets; HTML stays fresh. One page load pulls
    # dozens of these at once, so they get their own faster rate zone.
    # add_header here cancels the inherited security headers -- re-include.
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?|pdf)$ {
        limit_req zone=perip_assets burst=120 nodelay;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/vahini-headers.inc;
        try_files $uri /site$uri =404;
    }

    location / {
        try_files $uri $uri/ /site$uri /site$uri/ =404;
    }

    # Real 404s with a friendly page. The old fallback rewrote every
    # miss to the home page WITH STATUS 200 (the '=' form) - a soft 404
    # that invites crawlers to index junk URLs as duplicates of home.
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
