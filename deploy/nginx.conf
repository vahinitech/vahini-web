server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    client_max_body_size 25M;
    absolute_redirect off;

    proxy_intercept_errors on;

    # The marketing site lives in /site; send the bare domain there.
    location = / {
        return 302 /site/index.html;
    }

    # Dedicated analyser service hosts analyser pages/assets.
    location ^~ /analyser/ {
        proxy_pass http://analyser:8868;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward compatibility for historical analyser URL.
    location = /Vahini%20Analyser.html {
        return 302 /analyser/Vahini%20Analyser.html;
    }

    # Backward compatibility for historical report template URL.
    location = /Vahini%20Handwriting%20Report.html {
        return 302 /analyser/Vahini%20Handwriting%20Report.html;
    }

    # Legacy root analyser static files now live under /analyser/styles and /analyser/scripts/core.
    location = /report.css { return 302 /analyser/styles/report.css; }
    location = /studio.css { return 302 /analyser/styles/studio.css; }
    location = /nav.css { return 302 /analyser/styles/nav.css; }
    location = /engine.bundle.js { return 302 /analyser/scripts/core/engine.bundle.js; }
    location = /protect.js { return 302 /analyser/scripts/core/protect.js; }
    location = /report.js { return 302 /analyser/scripts/core/report.js; }
    location = /image-slot.js { return 302 /analyser/scripts/core/image-slot.js; }

    # Legacy informational/demo analyser HTML pages now live under /analyser/static/.
    location ~* ^/(Vahini.*\.html|Why\ Handwriting\ Matters\.html|20\ Factors\ Explained\.html)$ {
        return 302 /analyser/static$uri;
    }

    # Root-level analyser assets moved to /analyser/assets/.
    location ^~ /assets/ {
        return 302 /analyser$uri;
    }

    # OCR endpoint consumed by the analyser app.
    location = /ocr {
        client_max_body_size 25M;
        proxy_pass http://analyser:8868/ocr;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    location = /ocr/health {
        proxy_pass http://analyser:8868/ocr/health;
        proxy_read_timeout 10s;
    }

    # Context-aware OCR + layout API consumed by analyser app.
    location = /analyze-vl {
        client_max_body_size 25M;
        proxy_pass http://analyser:8868/analyze-vl;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    # Python-only 20-factor report API consumed by analyser app.
    location = /report-python {
        client_max_body_size 25M;
        proxy_pass http://analyser:8868/report-python;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 500 502 503 504 = @api_json_error;
    }

    location @api_json_error {
        default_type application/json;
        return 200 '{"ok":false,"error":"upstream temporarily unavailable","rec_texts":[],"rec_polys":[],"rec_scores":[],"analysis":null,"document_context":{},"layout":{},"regions":[],"factor_regions":{}}';
    }

    # Persistence API for uploads, generated reports, and feedback.
    location ^~ /persist/ {
        proxy_pass http://persist:8090;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /persist/health {
        proxy_pass http://persist:8090/health;
        proxy_read_timeout 10s;
    }

    # Long cache for static assets; HTML stays fresh.
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Friendly error fallback to the marketing home.
    error_page 404 = /site/index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
