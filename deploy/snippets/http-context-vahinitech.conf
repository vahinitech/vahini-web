#
# Host-edge rate/connection-limit zones shared by every vahinitech.com vhost.
# REQUIRED by deploy/*.nginx.conf -- install this file at
#   /etc/nginx/conf.d/00-vahinitech-limits.conf
# on the host BEFORE (re)loading any vhost that references the zones, or
# `nginx -t` fails with "zone ... is unknown".
#
# This is the first line of defense: it sheds floods at the TLS edge before
# they consume a proxied connection into the web container, whose own,
# finer-grained per-path limits (deploy/nginx-security.conf) then apply.
# Edge numbers are therefore deliberately looser than the container's -- the
# edge only needs to stop gross abuse, not police individual endpoints.
#
# True volumetric DDoS (L3/L4 floods that saturate the uplink) cannot be
# stopped by nginx at all -- see docs/SECURITY.md for CDN/upstream options.

limit_req_zone  $binary_remote_addr zone=edge_perip:20m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=edge_api:10m   rate=30r/m;
limit_conn_zone $binary_remote_addr zone=edge_conn:20m;
limit_req_status  429;
limit_conn_status 429;

# Don't advertise the nginx version at the edge either.
server_tokens off;
