#
# Shared TLS config for every vahinitech.com HTTPS server block. One wildcard
# cert (see deploy/certbot/setup-wildcard-cert.sh) covers vahinitech.com and
# every *.vahinitech.com subdomain, so every vhost points at the same
# lineage -- no per-subdomain cert path to keep in sync.
#
# Install once on the host, e.g. at /etc/nginx/snippets/tls-vahinitech.conf,
# then `include snippets/tls-vahinitech.conf;` inside each server block
# (path relative to nginx's config root -- adjust if your layout differs).

ssl_certificate     /etc/letsencrypt/live/vahinitech-wildcard/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/vahinitech-wildcard/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
