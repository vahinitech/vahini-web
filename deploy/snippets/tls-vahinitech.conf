#
# Shared TLS config for every vahinitech.com HTTPS server block. One wildcard
# cert (see deploy/certbot/setup-wildcard-cert.sh) covers vahinitech.com and
# every *.vahinitech.com subdomain, so every vhost points at the same
# lineage -- no per-subdomain cert path to keep in sync.
#
# Install once on the host, e.g. at /etc/nginx/snippets/tls-vahinitech.conf,
# then `include snippets/tls-vahinitech.conf;` inside each server block
# (path relative to nginx's config root -- adjust if your layout differs).

ssl_certificate     /etc/letsencrypt/live/vahinitech-wildcard/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/vahinitech-wildcard/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 suites are built in; for TLS 1.2 allow only forward-secret AEAD
# suites (drops CBC/static-RSA that the old HIGH:!aNULL:!MD5 list let in).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Resume sessions from the shared cache instead of full handshakes (cheaper
# under handshake floods); tickets off so resumption keys aren't long-lived.
ssl_session_cache shared:vahini_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Browsers pin HTTPS for 180 days. HSTS belongs here at the TLS edge; the
# other browser-security headers (X-Frame-Options, nosniff, CSP, ...) are
# set once inside the web container (deploy/nginx-headers.inc) so every
# vhost and proxied service inherits a single, consistent copy.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
