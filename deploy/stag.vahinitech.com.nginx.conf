#
# HTTP (port 80: ACME challenge + redirect to HTTPS) is now shared across
# every vahinitech.com subdomain -- see deploy/http-redirect.vahinitech.com.nginx.conf.
server {
    listen 110.172.148.13:443 ssl;
    http2 on;
    server_name stag.vahinitech.com;
    include snippets/tls-vahinitech.conf;
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
