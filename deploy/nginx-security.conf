#
# http-context security config for the web container. Installed as
# /etc/nginx/conf.d/00-security.conf (the 00- prefix makes nginx load it
# before vahini.conf, so the zones/maps below exist when the server block
# references them). Everything request-flood related lives here; the server
# block in deploy/nginx.conf decides which zone each location uses.
#
# Threat model note: nginx-level limits stop abusive clients, scripted
# scraping, brute-force floods and slowloris -- i.e. L7 abuse that actually
# reaches this box. True volumetric DDoS (L3/L4, spoofed SYN floods, tens of
# Gbps) must be absorbed upstream of the origin -- see docs/SECURITY.md for
# the CDN/upstream options.

# Don't advertise the nginx version in headers or error pages.
server_tokens off;

# ---- Real client IP -------------------------------------------------------
# This container sits behind the host nginx (see deploy/*.vhost files), which
# sets X-Real-IP to the true client address. Restore it so the per-IP zones
# below limit actual clients, not the one docker-bridge address every request
# arrives from. Only private ranges are trusted to assert X-Real-IP; a client
# hitting the container directly cannot spoof its identity.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# ---- Slow-client (slowloris) protection -----------------------------------
client_header_timeout 10s;
client_body_timeout 20s;
send_timeout 20s;
keepalive_timeout 25s;
reset_timedout_connection on;

# ---- Per-IP rate + connection limits --------------------------------------
# Four request classes with very different legitimate rates:
#   pages    HTML, redirects, health checks -- a human clicks a few per second
#   assets   css/js/img/fonts -- one page load pulls dozens at once
#   heavy    /ocr /analyze-vl /report-python -- CPU-bound ML inference; a real
#            analyser session makes a handful of calls per scan
#   persist  uploads/reports/feedback -- write endpoints, disk-backed
# Zones are keyed on the restored client IP. 10m of shared memory tracks
# ~160k distinct IPs per zone. Sizing rationale + tuning: docs/SECURITY.md.
limit_req_zone  $binary_remote_addr zone=perip_pages:10m   rate=12r/s;
limit_req_zone  $binary_remote_addr zone=perip_assets:10m  rate=60r/s;
limit_req_zone  $binary_remote_addr zone=perip_heavy:10m   rate=12r/m;
limit_req_zone  $binary_remote_addr zone=perip_persist:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# Rejected requests answer 429 (Too Many Requests), not the default 503, so
# well-behaved clients know to back off rather than treating us as down.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ---- Known vulnerability scanners -----------------------------------------
# Tools that only ever show up to probe for holes get their connection closed
# without a response (444 in the server block). This is a tripwire, not a
# defense -- serious attackers change their UA -- but it cheaply sheds the
# constant background scanner noise every public IP receives.
map $http_user_agent $vahini_blocked_agent {
    default 0;
    ~*(sqlmap|nikto|nessus|masscan|zgrab|nmap|acunetix|dirbuster|gobuster|wpscan|jorgee|libwww-perl) 1;
}

# ---- Content-Security-Policy, per path ------------------------------------
# One strict policy for the marketing site; the two notebook pages
# (investor.html, pitch-deck.dc.html) additionally need 'unsafe-eval' because
# site/js/support.js compiles .dc notebook markup with new Function(). The
# analyser app and the JSON APIs are proxied services with their own output
# -- they get no CSP from us (empty value => nginx omits the header).
# External origins allowed: Google Fonts (styles+fonts), GTM/GA4 (script,
# beacons -- consent-gated in site/js/site.js), unpkg (React/Babel fallback
# for notebook pages when the vendored copies fail), YouTube nocookie embeds
# + thumbnails on why-handwriting.html.
map $uri $vahini_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://i.ytimg.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/site/(investor\.html|pitch-deck\.dc\.html)$ "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/(analyser/|ocr|analyze-vl|report-python|persist/) "";
}
