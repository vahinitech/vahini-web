server {
    listen 110.172.148.13:80;
    server_name vahinitech.com www.vahinitech.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 110.172.148.13:443 ssl;
    http2 on;
    server_name vahinitech.com www.vahinitech.com;

    ssl_certificate     /etc/letsencrypt/live/vahinitech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vahinitech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 25M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
