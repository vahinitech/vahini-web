#
# api.vahinitech.com -- a friendlier host name for the recognition API that
# already runs behind vahinitech.com (/ocr, /report-python, /analyze-vl).
# There is no separate backend here: the analyser container has no port of
# its own exposed on this host (see deploy/docker-compose.prod.yml), it's
# only reachable through the same `web` container already listening on
# 127.0.0.1:3015 -- deploy/nginx.conf inside that container is what actually
# proxies these paths to the analyser service. This vhost just gives API
# consumers a dedicated host name instead of routing through the marketing
# domain, and only exposes the API paths (not the marketing site/HTML).
server {
    listen 110.172.148.13:80;
    server_name api.vahinitech.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 110.172.148.13:443 ssl;
    http2 on;
    server_name api.vahinitech.com;

    ssl_certificate     /etc/letsencrypt/live/api.vahinitech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vahinitech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 25M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Only the API surface -- not the marketing site, not /persist. Keep this
    # list in sync with the /ocr, /report-python, /analyze-vl, /ocr/health
    # location blocks in deploy/nginx.conf (the actual proxy to the analyser
    # service lives there; this just forwards through the same web container).
    location ~ ^/(ocr|ocr/health|report-python|analyze-vl)$ {
        proxy_pass http://127.0.0.1:3015;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type application/json;
        return 404 '{"ok":false,"error":"unknown endpoint","endpoints":["/ocr","/ocr/health","/report-python","/analyze-vl"]}';
    }
}
