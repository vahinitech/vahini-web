#
# One shared port-80 block for vahinitech.com AND every *.vahinitech.com
# subdomain: serve the ACME HTTP-01 webroot (still used for the DNS-01
# wildcard cert's own domain-control side-channel isn't needed here, but kept
# so any future one-off HTTP-01 cert still works) and redirect everything
# else to HTTPS. Previously every *.vahinitech.com.nginx.conf repeated this
# same block; a new subdomain no longer needs one at all -- server_name
# "*.vahinitech.com" already matches it.
server {
    listen 110.172.148.13:80;
    server_name vahinitech.com *.vahinitech.com;
    # 301s are cheap but not free -- shed port-80 floods too (zones:
    # deploy/snippets/http-context-vahinitech.conf, installed at
    # /etc/nginx/conf.d/00-vahinitech-limits.conf).
    limit_req zone=edge_perip burst=120 nodelay;
    limit_conn edge_conn 60;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
