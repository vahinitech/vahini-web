# Optional standalone analyser vhost split (staging/prod)
# SPDX-License-Identifier: AGPL-3.0-only
#
# Use this when you want analyser on a separate domain, e.g. analyser.vahinitech.com,
# while main site remains on vahinitech.com.
#
# Staging upstream: 127.0.0.1:3016
# Production upstream: 127.0.0.1:3015

server {
    listen 80;
    server_name analyser.vahinitech.com;

    # Increase this if larger upload pages are expected.
    client_max_body_size 25m;

    location = / {
        return 302 /analyser/analyser.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
