services:
  analyser:
    container_name: vahini-analyser-prod
    build:
      context: ../analyser
      dockerfile: server/Dockerfile.analyser
    image: vahini/analyser:prod
    restart: unless-stopped
    environment:
      - PORT=8868
      - VAHINI_OCR_LANGS=en,te
      - VAHINI_OCR_VARIANTS=2
      - VAHINI_OCR_GPU=0
    volumes:
      - /home/vishnu/paddle-models/.paddlex:/opt/paddle-models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8868/ocr/health', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3

  persist:
    container_name: vahini-persist-prod
    build:
      context: ..
      dockerfile: services/persist-api/Dockerfile
    image: vahini/persist:prod
    restart: unless-stopped
    environment:
      - PORT=8090
      - MAX_BODY_BYTES=157286400
      - PERSIST_UPLOADS_DIR=/data/uploads
      - PERSIST_REPORTS_DIR=/data/reports
      - PERSIST_FEEDBACK_DIR=/data/feedback
    volumes:
      - /home/vishnu/uploads:/data/uploads
      - /home/vishnu/reports:/data/reports
      - /home/vishnu/feedback:/data/feedback
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    container_name: vahini-site-prod
    build:
      context: ..
      dockerfile: Dockerfile
    image: vahini/site:prod
    restart: unless-stopped
    networks:
      - default
      - app_shared
    depends_on:
      analyser:
        condition: service_healthy
      persist:
        condition: service_healthy
    ports:
      - "127.0.0.1:3015:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/site/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  app_shared:
    external: true
    name: app_default
