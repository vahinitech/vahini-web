<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Vahini — Engine Smoke Tests</title>
<link rel="stylesheet" href="../analyser/frontend/styles/report.css">
<style>
  body{font-family:"Hanken Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;background:#EEEEEE;color:#222831;margin:0;padding:32px;}
  h1{font-family:"Spectral",Georgia,serif;font-size:26px;margin:0 0 4px;}
  .sub{color:#565D66;font-size:14px;margin-bottom:22px;}
  .summary{font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;margin-bottom:18px;}
  .summary.pass{background:#DCF1E8;color:#0F6E56;}
  .summary.fail{background:#F8E5E1;color:#A80016;}
  ul{list-style:none;padding:0;margin:0;max-width:760px;}
  li{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;background:#fff;border:1px solid rgba(34,40,49,.1);border-radius:10px;margin-bottom:8px;font-size:14px;}
  .ok{color:#0F6E56;font-weight:800;} .no{color:#A80016;font-weight:800;} .warn{color:#8A5410;font-weight:800;}
  .name{font-weight:600;} .why{color:#565D66;}
  #host{position:absolute;left:-99999px;top:0;width:794px;}
</style>
</head>
<body>
<!-- STALE as of analyser v0.3: the in-browser VahiniEngine/VahiniFactors/
     VahiniForecast/VahiniReport.render API this test drives was removed
     upstream -- scoring now runs server-side (see analyser/docs/BUILD.md).
     This file will fail loudly (ReferenceError) until it is rewritten
     against the new /report-python API; it is intentionally not wired into
     package.json/CI so it doesn't block merges. -->
<h1>Vahini — Engine Smoke Tests</h1>
<div class="sub">Loads the packed <code>engine.bundle.js</code> and exercises the analysis engine + report. No toolchain required.</div>
<div class="summary" id="summary">Running…</div>
<ul id="results"></ul>
<div id="host"></div>

<script src="../analyser/frontend/scripts/core/engine.bundle.js"></script>
<script>
(function(){
  var results=[], hardFail=false;
  function add(ok, name, why){ results.push({ok:ok, name:name, why:why||''}); if(ok==='no') hardFail=true; }
  function assert(cond, name, why){ add(cond?'ok':'no', name, cond?'':(why||'expected truthy')); }

  function render(){
    var ul=document.getElementById('results'); ul.innerHTML='';
    results.forEach(function(r){
      var sym = r.ok==='ok'?'<span class="ok">✓</span>':r.ok==='warn'?'<span class="warn">⚠</span>':'<span class="no">✗</span>';
      ul.insertAdjacentHTML('beforeend','<li>'+sym+'<span><span class="name">'+r.name+'</span>'+(r.why?' — <span class="why">'+r.why+'</span>':'')+'</span></li>');
    });
    var passed=results.filter(function(r){return r.ok!=='no';}).length;
    var s=document.getElementById('summary');
    s.className='summary '+(hardFail?'fail':'pass');
    s.textContent=(hardFail?'✗ FAIL — ':'✓ PASS — ')+passed+' / '+results.length+' checks green'+(hardFail?' (see ✗ below)':'');
  }

  function run(){
    // 1) public API present (proves the packed bundle loaded & executed)
    assert(typeof window.VahiniEngine==='object', 'VahiniEngine API exposed by bundle');
    assert(typeof window.VahiniFactors==='object', 'VahiniFactors API exposed by bundle');
    assert(typeof window.VahiniReport==='object', 'VahiniReport API exposed by bundle');
    assert(typeof window.VahiniForecast==='object', 'VahiniForecast API exposed by bundle');
    if(!window.VahiniEngine||!window.VahiniFactors){ render(); return; }

    var img=new Image();
    img.onload=function(){ try{ runWithImage(img); }catch(e){ add('no','pipeline threw', String(e)); render(); } };
    img.onerror=function(){ add('no','load sample image','../uploads/test-handwriting.png not found'); render(); };
    img.src='../uploads/test-handwriting.png';
  }

  function runWithImage(img){
    var out=VahiniEngine.analyze(img);
    var metrics=out.metrics, overlay=out.overlay;
    assert(metrics && typeof metrics==='object', 'engine.analyze() returns metrics');

    var analysis=VahiniFactors.scoreAll(metrics);
    assert(analysis.results.length===20, 'scoreAll() returns 20 factors', 'got '+analysis.results.length);
    assert(analysis.overall>=0 && analysis.overall<=100, 'overall score within 0–100', 'got '+analysis.overall);

    // Fix #8 — validity gate ran (every result carries an `unmeasured` flag)
    var gated=analysis.results.every(function(r){ return 'unmeasured' in r; });
    assert(gated, 'validity gate present on every factor (Fix #8)');

    // Fix #5 — Dynamics section not numerically scored from a photo
    var dyn=analysis.sections.find(function(s){return s.id==='dynamics';});
    assert(dyn && dyn.avg===null, 'Dynamics avg is null in photo mode (Fix #5)', dyn?('avg='+dyn.avg):'no dynamics section');

    // pen-pending factors excluded from measured headline
    assert(analysis.measuredCount<20, 'measuredCount < 20 in photo mode', 'measuredCount='+analysis.measuredCount);

    // report render + duplicate-page check (Fix: blank/duplicate A4 pages)
    try{
      var det = (window.VahiniOCR && overlay) ? VahiniOCR.renderDetection(overlay.canvas, overlay, 'detect') : null;
      VahiniReport.render(document.getElementById('host'), {
        intake:{ role:'individual', writerName:'' },
        analysis:analysis, expectedText:'', recognizedText:'',
        detURL: det ? det.toDataURL('image/jpeg',0.7) : null,
        crops:null, letterFindings:null, history:null,
        pipeline:{ binMethod:metrics.binMethod, nLines:metrics.nLines, nWords:metrics.nWords, nChars:metrics.nChars, ocrEngine:'local', docType:metrics.docType, quality:metrics.quality }
      });
      var pages=document.querySelectorAll('#host .page');
      assert(pages.length>=6, 'report renders multiple A4 pages', 'got '+pages.length);
      var labels=[].map.call(pages,function(p){return p.getAttribute('data-screen-label')||p.className;});
      var dup=false; for(var i=1;i<labels.length;i++){ if(labels[i]&&labels[i]===labels[i-1]) dup=true; }
      assert(!dup, 'no duplicate adjacent pages (PDF dup-page fix)', dup?'adjacent identical labels found':'');
    }catch(e){ add('warn','report render check skipped', String(e)); }

    render();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>
</body>
</html>
